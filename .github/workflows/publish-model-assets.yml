name: Publish Bonsai model assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.2.0
      MODEL_NAME: Ternary-Bonsai-2-27B-PTQ1_0.gguf
      MMPROJ_NAME: Ternary-Bonsai-2-27B-mmproj-Q8_0.gguf
      MODEL_SHA256: 53107F530AA52EB00912263AB1EE29BD199261C87CD7B4AD4CA1318C1FE33EE3
      MMPROJ_SHA256: 6807EDE61D570BB86BA34B756A0FA109EDC33668604DE867C6EA6D8F1D631903

    steps:
      - name: Prepare draft release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\" and .draft == true) | .id" | head -n 1)"
          if [[ -z "$release_id" ]]; then
            release_id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$RELEASE_TAG" \
              -f target_commitish="main" \
              -f name="Bonsai 2 27B inference files v0.2.0" \
              -F draft=true \
              -F prerelease=false \
              --jq .id)"
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            --paginate --jq '.[].id' | while read -r asset_id; do
              [[ -n "$asset_id" ]] && gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            done
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Download, verify and split main model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          model_url="https://huggingface.co/prism-ml/Ternary-Bonsai-2-27B-gguf/resolve/main/$MODEL_NAME?download=true"
          curl --fail --location --retry 8 --retry-delay 10 "$model_url" \
            | split --bytes=1800M --numeric-suffixes=1 --suffix-length=2 - "release-assets/$MODEL_NAME.part"
          actual="$(cat release-assets/$MODEL_NAME.part* | sha256sum | awk '{print toupper($1)}')"
          test "$actual" = "$MODEL_SHA256"

      - name: Download and verify vision projector
        shell: bash
        run: |
          set -euo pipefail
          mmproj_url="https://huggingface.co/prism-ml/Ternary-Bonsai-2-27B-gguf/resolve/main/$MMPROJ_NAME?download=true"
          curl --fail --location --retry 8 --retry-delay 10 --output "release-assets/$MMPROJ_NAME" "$mmproj_url"
          actual="$(sha256sum "release-assets/$MMPROJ_NAME" | awk '{print toupper($1)}')"
          test "$actual" = "$MMPROJ_SHA256"

      - name: Create checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "$MODEL_SHA256  $MODEL_NAME"
            echo "$MMPROJ_SHA256  $MMPROJ_NAME"
            for file in release-assets/*.part*; do
              sha256sum "$file" | awk '{print toupper($1) "  " $2}' | sed 's#  release-assets/#  #'
            done
          } > release-assets/SHA256SUMS.txt

      - name: Upload verified assets
        shell: bash
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -euo pipefail
          for file in release-assets/*; do
            name="$(basename "$file")"
            echo "Uploading $name"
            curl --fail --location --retry 5 --retry-delay 10 \
              --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "Content-Type: application/octet-stream" \
              --upload-file "$file" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$name" >/dev/null
          done

      - name: Publish release
        shell: bash
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -euo pipefail
          body=$(cat <<'EOF'
          Inference assets for the Xinbao fast prompt node.

          Download all four PTQ1_0 model parts plus the Q8_0 vision projector. The repository installer joins and verifies the model automatically. Install to `ComfyUI/models/LLM/Bonsai2-27B/`.

          The matching Windows CUDA 12.4 runtime is downloaded from the official Prism ML llama.cpp release by `scripts/install_bonsai_windows.ps1`.

          Model source: `prism-ml/Ternary-Bonsai-2-27B-gguf` (Apache-2.0). Created using Bonsai by Prism ML.
          EOF
          )
          jq -n --arg body "$body" '{draft:false, prerelease:false, make_latest:"true", body:$body}' \
            | gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --input -
